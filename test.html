/* --- FOND GLOBAL ANIMÉ --- */
body {
  margin: 0;

  color: #f5e9ff;
  display: flex;
  justify-content: center;
}

@keyframes bgMove {
  0% { background-position: 50% 0%; }
  50% { background-position: 50% 100%; }
  100% { background-position: 50% 0%; }
}

/* --- CONTAINER --- */
.app {
  max-width: 480px;
  width: 100%;
  padding: 16px;
}

/* --- TITRES --- */
h1 {
  text-align: center;
  font-size: 2.2rem;
  margin-bottom: 12px;
  color: #f3e8ff;
  text-shadow: 0 0 12px #c084fc, 0 0 20px #a855f7;
}

.card h2 {

  text-shadow: 0 0 8px #a855f7;
}

/* --- CARTES --- */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35),
              0 0 18px rgba(168,85,247,0.4);
  border: 1px solid rgba(255,255,255,0.18);
  overflow: visible;
}

/* --- PLATEAU --- */
.board {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  padding: 10px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  box-shadow: inset 0 0 20px rgba(168,85,247,0.3);
}

/* --- SUPPRESSION DE L’IMAGE DE FOND --- */
.board::after {
  content: none;
}

/* --- CASES --- */
.cell {
  aspect-ratio: 1/1;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.07);
  box-shadow: inset 0 0 12px rgba(0,0,0,0.5),
              0 0 14px rgba(168,85,247,0.5);
  border: 2px solid rgba(255,255,255,0.18);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}

.cell:hover {
  transform: scale(1.07);
  box-shadow: 0 0 18px rgba(168,85,247,0.9);
}

/* Reflet glossy */
.cell::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 45%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.45), rgba(255,255,255,0));
}

/* Icône watermark */
.cell::after {
  content: attr(data-icon);
  position: absolute;
  font-size: 2.6rem;
  opacity: 0.22;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Numéro */
.cell span.num {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 0.75rem;
  opacity: 0.85;
  color: #f3e8ff;
}

/* --- COULEURS PAR THÈME --- */
.theme-depart { background: #a78bfa55; border-color: #c4b5fd88; }
.theme-victoire { background: linear-gradient(135deg, #facc15, #f59e0b); }

.theme-physique { background: #7c3aed88; }
.theme-philo { background: #9333ea88; }
.theme-bio { background: #10b98188; }
.theme-maths { background: #6366f188; }
.theme-duel { background: #ef444488; }
.theme-definition { background: #0ea5e988; }

/* --- HALO CASE ACTIVE --- */
.active-cell {
  box-shadow: 0 0 20px #c084fc, 0 0 30px #a855f7 !important;
  transform: scale(1.08) !important;
}

/* --- PIONS --- */
.pawn {
  position: absolute;
  font-size: 2rem;
  transition: all 0.4s ease;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 8px #c084fc);
}

.pawn-moving {
  animation: pawnJump 0.35s ease;
}

@keyframes pawnJump {
  0% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -60%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* --- DÉ --- */
.dice {
  font-size: 3.2rem;
  text-align: center;
  margin: 10px 0;
  transition: transform 0.3s ease;
  text-shadow: 0 0 12px #c084fc;
}

.dice.roll {
  transform: rotate(360deg) scale(1.3);
}

/* --- BOUTONS --- */
button {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: white;

button:hover {
  background: linear-gradient(135deg, #a855f7, #c084fc);
}

/* --- ZONE QUESTION --- */
#questionArea {
  position: relative;
  min-height: 240px; /* empêche le flip de dépasser */
}

/* --- FLIP 3D --- */
.flip-card {
  perspective: 1200px;
  width: 100%;
  position: relative;
  z-index: 50;
}

.flip-inner {
  position: relative;
  width: 100%;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
}

.flip-active .flip-inner {
  transform: rotateY(180deg);
}

.flip-front, .flip-back {
  position: absolute;
  width: 100%;
  backface-visibility: hidden;
  frontface-visibility: hidden;
  border-radius: 16px;
  padding: 16px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 0 14px rgba(168,85,247,0.5);

.flip-back {
  transform: rotateY(180deg);
}

/* --- SHAKE --- */
.shake {
  animation: shakeCard 0.4s ease;

@keyframes shakeCard {
  0% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

/* --- Mélange interne de chaque thème (questions mélangées) --- */
function shuffleArray(arr) {
  arr.sort(() => Math.random() - 0.5);
}
/* --- VARIABLES GLOBALES --- */
const boardElement = document.getElementById("board");
const turnInfo = document.getElementById("turnInfo");
const diceEl = document.getElementById("dice");
const diceResult = document.getElementById("diceResult");
const questionArea = document.getElementById("questionArea");
const answerButtons = document.getElementById("answerButtons");

let players = [];
let currentPlayerIndex = 0;
let currentCellIndex = {};
let lastTheme = null;

/* --- CRÉATION DU PLATEAU --- */
function createBoard() {
  boardElement.innerHTML = "";
  cells.forEach(cell => {
    const div = document.createElement("div");
    div.classList.add("cell");
    div.classList.add("theme-" + cell.type);
    div.dataset.index = cell.index;
    div.dataset.type = cell.type;
    div.setAttribute("data-icon", "");
    div.innerHTML = `<span class="num">${cell.index + 1}</span>`;
    boardElement.appendChild(div);
  });
}

/* --- GESTION DES JOUEURS --- */
function addPlayer() {
  document.getElementById("soundClick").play();

  const nameInput = document.getElementById("playerName");
  const pawnInput = document.getElementById("playerPawn");
  const name = nameInput.value.trim();
  const pawn = pawnInput.value.trim() || "🐱";

  if (!name) return;

  players.push({ name, pawn, isBlocked:false });
  currentCellIndex[name] = 0;
  updatePlayersList();
  updateTurnInfo();
  renderPawns();
  nameInput.value = "";
  pawnInput.value = "";
}

function updatePlayersList() {
  const list = document.getElementById("playersList");
  list.innerHTML = "";
  players.forEach((p, i) => {
    const div = document.createElement("div");
    div.textContent = `${i+1}. ${p.name} (${p.pawn})`;
    list.appendChild(div);
  });
}

function updateTurnInfo() {
  if (players.length === 0) {
    turnInfo.textContent = "Ajoute au moins un joueur.";
    return;
  }
  const p = players[currentPlayerIndex];
  turnInfo.textContent = `Tour de ${p.name} ${p.pawn}`;
}

/* --- AFFICHAGE DES PIONS + HALO CASE ACTIVE --- */
function renderPawns() {
  document.querySelectorAll(".pawn").forEach(el => el.remove());
  document.querySelectorAll(".active-cell").forEach(c => c.classList.remove("active-cell"));

  players.forEach(p => {
    const cellIndex = currentCellIndex[p.name];
    const cellDiv = document.querySelector(`.cell[data-index="${cellIndex}"]`);
    if (!cellDiv) return;
    const pawnEl = document.createElement("div");
    pawnEl.classList.add("pawn", "pawn-moving");
    pawnEl.textContent = p.pawn;
    pawnEl.style.top = "50%";
    pawnEl.style.left = "50%";
    cellDiv.appendChild(pawnEl);
    setTimeout(() => pawnEl.classList.remove("pawn-moving"), 350);
  });

  if (players.length > 0) {
    const activePlayer = players[currentPlayerIndex];
    const activeIndex = currentCellIndex[activePlayer.name];
    const activeCell = document.querySelector(`.cell[data-index="${activeIndex}"]`);
    if (activeCell) activeCell.classList.add("active-cell");
  }
}

/* --- LANCER DE DÉ --- */
function rollDice() {
  if (players.length === 0) return;

  const player = players[currentPlayerIndex];

  // Joueur bloqué : ne lance pas le dé, tire une carte du thème de sa case
  if (player.isBlocked) {
    const cellIndex = currentCellIndex[player.name];
    const cell = cells.find(c => c.index === cellIndex);
    if (cell) lastTheme = cell.type;

    diceResult.textContent = `${player.name} est bloqué : il doit répondre juste pour relancer le dé.`;
    document.getElementById("soundClick").play();
    drawCard();
    return;
  }

  document.getElementById("soundDice").play();
  diceEl.classList.add("roll");
  const value = Math.floor(Math.random() * 6) + 1;

  setTimeout(() => {
    diceEl.classList.remove("roll");
    diceResult.textContent = `Résultat : ${value}`;
    moveCurrentPlayer(value);
  }, 300);
}

/* --- DÉPLACEMENT --- */
function moveCurrentPlayer(steps) {
  const player = players[currentPlayerIndex];
  let index = currentCellIndex[player.name] || 0;
  index += steps;
  if (index >= cells.length) index = cells.length - 1;
  currentCellIndex[player.name] = index;
  renderPawns();

  const cell = cells.find(c => c.index === index);
  if (!cell) return;

  if (cell.type === "victoire") {
    showVictory(player);
  } else if (cell.type === "depart") {
    lastTheme = null;
    questionArea.innerHTML = "<div class='question-card'>Case départ : aucun défi.</div>";
    answerButtons.style.display = "none";
    nextPlayer();
  } else {
    lastTheme = cell.type;
    drawCard();
  }
}

/* --- VICTOIRE --- */
function showVictory(player) {
  document.getElementById("soundWin").play();
  questionArea.innerHTML = `<div class="question-card"><strong>${player.name}</strong> ${player.pawn} a gagné ! 👑🎉</div>`;
  answerButtons.style.display = "none";
}

/* --- CHOIX DU TABLEAU DE QUESTIONS --- */
function getQuestionArrayForTheme(theme) {
  switch(theme) {
    case "philo": return questionsPhilo;
    case "bio": return questionsBio;
    case "physique": return questionsPhysique;
    case "maths": return questionsMaths;
    case "duel": return questionsDuel;
    case "definition": return questionsDefinition;
    default: return null;
  }
}

/* --- TIRAGE D’UNE CARTE AVEC FLIP 3D --- */
function drawCard() {
  const arr = getQuestionArrayForTheme(lastTheme);
  if (!arr || arr.length === 0) {
    questionArea.innerHTML = `<div class='question-card'>Aucune question disponible.</div>`;
    answerButtons.style.display = "none";
    return;
  }

  const card = arr[0];
  arr.push(arr.shift());

  questionArea.innerHTML = `
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="flip-front">
          <div><strong>Thème :</strong> ${card.theme}</div>
          <div style="margin-top:6px;"><strong>Question :</strong> ${card.question}</div>
          <button style="margin-top:10px;" onclick="flipCard()">Voir la réponse</button>
        </div>
        <div class="flip-back">
          <div><strong>Réponse :</strong> ${card.answer}</div>
          <button style="margin-top:10px;" onclick="flipCard()">Retourner</button>
        </div>
      </div>
    </div>
  `;

  answerButtons.style.display = "block";
  questionArea.classList.add("shake");
  setTimeout(() => questionArea.classList.remove("shake"), 400);
}

/* --- FLIP DE LA CARTE --- */
function flipCard() {
  document.getElementById("soundClick").play();
  const card = document.getElementById("flipCard");
  if (card) card.classList.toggle("flip-active");
}

/* --- RÉPONSE JUSTE --- */
function answerCorrect() {
  document.getElementById("soundClick").play();
  const player = players[currentPlayerIndex];
  player.isBlocked = false;
  nextPlayer();
}

/* --- RÉPONSE FAUSSE --- */
function answerWrong() {
  document.getElementById("soundClick").play();
  const player = players[currentPlayerIndex];
  player.isBlocked = true;
  nextPlayer();
}

/* --- PASSER AU JOUEUR SUIVANT --- */
function nextPlayer() {
  if (players.length === 0) return;
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateTurnInfo();
  renderPawns();
}

/* --- INITIALISATION --- */
createBoard();
updateTurnInfo();
renderPawns();

</script>
